version: "2"

linters:
  enable:
    - bodyclose       # HTTP response bodies must be closed
    - errcheck        # unchecked errors
    - gosec           # security issues
    - govet           # suspicious constructs
    - ineffassign     # assignments with no effect
    - misspell        # spelling mistakes in comments and strings
    - noctx           # HTTP requests sent without context.Context
    - prealloc        # slice declarations that could be preallocated
    - staticcheck     # static analysis (includes gosimple and unused)

linters-settings:
  gosec:
    excludes:
      - G304  # file path from variable — expected in this tool

issues:
  max-same-issues: 0
